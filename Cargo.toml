[package]
name = "tlv-rs"
version = "0.3.0"
edition = "2021"
authors = ["Frostie314159"]
license = "MIT OR Apache-2.0"
description = "A parser for SIMPLE TLVs."
readme = "README.md"
repository = "https://github.com/Frostie314159/tlv-rs"

[dependencies]
heapless = "0.8.0"
no-panic = "0.1.35"
scroll = { version = "0.13.0", default-features = false }

[dev-dependencies]
cfg-if = "1.0.0"
criterion = { version = "0.6.0", features = ["html_reports"] }
macro-bits = "0.1.5"

[features]
no_panic = []
alloc = []

[[bench]]
name = "tlv_rs"
harness = false
